<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONTACT | スタジオささめ</title>
    <link rel="icon" type="image/png" href="assets/images/favicon/favicon.png" />

    <!-- OGP / Twitter Card -->
    <meta property="og:title" content="CONTACT | スタジオささめ" />
    <meta
      property="og:description"
      content="スタジオささめへのお問い合わせはこちらから。ご意見・ご感想・不具合報告などお気軽にご連絡ください。"
    />
    <meta property="og:image" content="assets/images/ogp/contact.png" />
    <!-- TODO: 本番ドメイン確定後、相対パスから絶対URLに差し替える -->
    <meta property="og:url" content="contact.html" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="site-header__logo">スタジオささめ</a>
      <button
        type="button"
        id="hamburger-btn"
        class="hamburger-btn"
        aria-label="メニューを開く"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        <span class="hamburger-btn__bar"></span>
        <span class="hamburger-btn__bar"></span>
        <span class="hamburger-btn__bar"></span>
      </button>
    </header>

    <nav class="site-nav" id="site-nav" aria-hidden="true">
      <ul class="site-nav__list">
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="gallery.html">GALLERY</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="privacy-policy.html">プライバシーポリシー</a></li>
      </ul>
    </nav>

    <main>
      <section class="contact" aria-labelledby="contact-heading">
        <h2 id="contact-heading">CONTACT</h2>
        <p class="contact__lead">
          ご意見・ご感想・不具合報告などございましたら、以下のフォームよりお気軽にお問い合わせください。
          送信いただいた氏名・メールアドレスの取り扱いについては
          <a href="privacy-policy.html">プライバシーポリシー</a>をご確認ください。
        </p>

        <form class="contact-form" id="contact-form" novalidate>
          <div class="contact-form__field">
            <label class="contact-form__label" for="contact-name">氏名<span class="contact-form__required">必須</span></label>
            <input
              class="contact-form__input"
              type="text"
              id="contact-name"
              name="name"
              autocomplete="name"
              required
            />
          </div>

          <div class="contact-form__field">
            <label class="contact-form__label" for="contact-email"
              >メールアドレス<span class="contact-form__required">必須</span></label
            >
            <input
              class="contact-form__input"
              type="email"
              id="contact-email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="contact-form__field">
            <label class="contact-form__label" for="contact-message"
              >お問い合わせ内容<span class="contact-form__required">必須</span></label
            >
            <textarea
              class="contact-form__textarea"
              id="contact-message"
              name="message"
              rows="8"
              required
            ></textarea>
          </div>

          <button class="contact-form__submit" type="submit">送信する</button>

          <p class="contact-form__result" id="contact-form-result" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <!--
      EmailJSはjsdelivr(npmパッケージ配信)のCDN経由で<script>タグとして読み込むのみで、
      ビルド手順・バンドラは使用しない(ビルドレス方針を維持する)。
      詳細はdocs/300_開発/310_決定メモ/311_決定メモ.md参照。
    -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="src/js/header.js"></script>
    <script type="module" src="src/js/contact.js"></script>
  </body>
</html>
